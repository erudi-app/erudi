appId: com.erudi.app
productName: Erudi
copyright: "Copyright © 2025 Erudi Team"

# Autonomous build: electron-builder packages the standalone webpack output
# directly (no electron-forge, no --prepackaged). The main entry is
# package.json "main" = .webpack/main.
directories:
  output: dist
  buildResources: assets

files:
  - ".webpack/**/*"
  - "package.json"
  - "!**/*.map"

asar: true
asarUnpack:
  - "**/*.node"

# The PyInstaller-frozen backend ships outside the asar (it is spawned as a
# child process). Built by CI before electron-builder runs; staged at
# backend/dist/backend.
extraResources:
  - from: "../backend/dist/backend"
    to: "backend"

# Reproduce the security fuses the forge plugin used to apply at package time.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# GitHub Releases — electron-updater reads <channel>.yml from here at runtime.
# Release-candidate gate: a tag builds + signs + notarizes and publishes a DRAFT
# release. electron-updater never offers a draft (its feed 404s while drafted), so
# clients are not touched. A maintainer downloads the exact signed draft artifact,
# runs the manual QA scenarios (inference, KB, upgrade — see
# docs/dev/release-qa-checklist.md), then promotes the draft (un-draft + changelog)
# to ship it via auto-update. Prerelease-tagged versions (e.g. 0.0.1-test.1) are
# auto-flagged prerelease, so test tags never masquerade as a stable update.
#
# Windows ships TWO auto-update channels from the one release: the CPU build feeds
# the default `latest` channel (universal — runs on every machine), the CUDA build
# feeds a `cuda` channel. The channel + a distinct artifact name are injected per
# leg in CI (release.yml: `-c.publish.channel=cuda -c.nsis.artifactName=…`), NOT
# here — a `channel` set here would wrongly apply to mac + win-cpu too. Each
# installed app follows the channel baked into its app-update.yml at build time.
publish:
  provider: github
  owner: erudi-app
  repo: erudi
  releaseType: draft

# ---------- Windows ----------
win:
  target:
    - target: nsis
      arch: x64
  icon: assets/icons/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  installerHeaderIcon: assets/icons/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Erudi

# ---------- macOS ----------
# electron-updater needs the zip target for delta updates; the DMG is the
# first-install artifact. electron-builder signs (with the entitlements below),
# notarizes and staples in one pass — no manual codesign dance.
mac:
  # The frozen backend needs macOS 14 (Sonoma): mlx/mlx-metal 0.32.x and torch 2.12
  # only ship macosx_14_0+ arm64 wheels, and numpy/scipy resolve to their 14_0
  # wheels on the macos-14 release runner. Below 14 the app launched and the
  # backend died at import time ("built for macOS 14.0 which is newer than
  # running OS") behind a generic "Backend failed to load" screen (#343). Declare
  # the real floor so the installer refuses older systems with Apple's own dialog.
  minimumSystemVersion: "14.0"
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: assets/icons/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: true
  # electron-builder's own signing walk (@electron/osx-sign's walkAsync) already
  # recurses through the whole Contents/ tree, including Resources/, and signs
  # every binary file it finds there — the bundled backend executable included.
  # Listing it here is belt-and-braces, not what makes it get signed.
  binaries:
    - "Contents/Resources/backend/backend"

dmg:
  background: assets/installers/dmg-background.png
  window:
    width: 640
    height: 440
  contents:
    - x: 200
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# ---------- Linux ----------
# AppImage is the auto-updating Linux artifact (electron-updater reads
# latest-linux.yml / cuda-linux.yml; deb/rpm do not self-update). Unsigned for now.
# Like Windows, the CUDA build ships on a separate `cuda` channel injected per leg
# in CI (release.yml: -c.publish.channel=cuda); the CPU build feeds `latest`.
linux:
  target:
    - target: AppImage
      arch: x64
  icon: assets/icons/icon-512.png
  category: Utility
  synopsis: Run open-source LLMs locally
