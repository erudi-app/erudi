name: Frontend CI

# See the comment in backend-ci.yml: `push` restricted to main kills the
# duplicate run on every PR commit, `merge_group` keeps the merge queue able to
# see this check, and the `paths` filter is gone because a required check that
# a path filter skips never reports and blocks the pull request forever.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint:check

      - name: Format check (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm run test:run
