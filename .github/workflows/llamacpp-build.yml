name: llama.cpp build

# Compile the inference binary -- and start it -- when, and only when, a pull
# request touches the code that produces it.
#
# Why this exists: nothing else in CI compiles llama.cpp. `release.yml` is
# triggered by a tag, and `app-build-smoke` deliberately skips the inference
# binary because it only proves the backend boots. So the CUDA compile flags --
# the architecture list, the toolkit version, the ggml options -- could be
# changed and merged with no verification at all, and the mistake would only
# surface when someone pushed a release tag. That happened: a `GGML_CUDA_F16`
# flag sat in both scripts long after upstream deleted the option, silently
# swallowed by CMake as an unused cache variable.
#
# This is NOT a required check. It is path-filtered, and a required check that
# a path filter skips never reports and would block every unrelated pull
# request. It runs on the handful of pull requests that touch these files.
on:
  pull_request:
    paths:
      - "scripts/dev/backend/build-llamacpp-*"
      - "backend/forks/llama-cpp"
      - ".github/workflows/llamacpp-build.yml"
  workflow_dispatch:

concurrency:
  group: llamacpp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: llamacpp (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same runners as release.yml: windows-latest drifted to a VS/MSVC
          # pair nvcc cannot parse, so the CUDA legs pin windows-2022.
          - os: ubuntu-22.04
            label: linux-cuda
            script: bash scripts/dev/backend/build-llamacpp-cuda-linux.sh
            binary: backend/artifacts/llama-cpp/cuda/bin/llama-server
            cuda: true
          - os: windows-2022
            label: win-cuda
            script: ./scripts/dev/backend/build-llamacpp-cuda-win.ps1
            binary: backend/artifacts/llama-cpp/cuda/bin/llama-server.exe
            cuda: true
          - os: ubuntu-22.04
            label: linux-cpu
            script: bash scripts/dev/backend/build-llamacpp-cpu-linux.sh
            binary: backend/artifacts/llama-cpp/cpu/bin/llama-server
            cuda: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # the llama.cpp source itself

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Compiling needs the toolkit but NOT a GPU, so a GPU-less runner is fine.
      # Kept in step with release.yml: 12.8 is the first toolkit whose nvcc can
      # emit native code for Blackwell (sm_120), which the build scripts add
      # only when they detect >= 12.8.
      - name: Install CUDA Toolkit (Windows)
        if: matrix.cuda && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
      - name: Install CUDA Toolkit (Linux — toolkit only, no driver)
        if: matrix.cuda && runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cccl", "nvtx", "nvrtc-dev"]'
          non-cuda-sub-packages: '["libcublas-dev"]'

      # The CUDA compile links a large static library per binary and has filled
      # a thin runner mid-build before; drop preinstalled bloat we never use.
      - name: Free disk space
        if: matrix.cuda && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install cmake
        run: python -m pip install --upgrade pip cmake

      - name: Compile llama-server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.script }}

      - name: Compile llama-server (Linux)
        if: runner.os == 'Linux'
        run: ${{ matrix.script }}

      # The scripts check the file lands, but a filename is a weak claim: it
      # holds for a truncated file, a zero-byte file, one built for the wrong
      # architecture, or one whose shared libraries cannot be resolved. So this
      # job goes past existence, as far as each runner physically allows.
      #
      # A CPU binary is started. `--version` prints the build header from
      # llama.cpp's common/arg.cpp and calls exit(0) inside the argument parser,
      # which runs before llama_backend_init() and loads no model, so it costs
      # nothing and needs no accelerator. Reaching that print means the file is
      # a loadable executable for this architecture and every library it links
      # resolved.
      #
      # A CUDA binary cannot be started here, and no choice of argument changes
      # that. ggml compiles its VMM path in by default (GGML_CUDA_NO_VMM is OFF,
      # so common.cuh defines GGML_USE_VMM), ggml-cuda therefore calls the CUDA
      # driver API, and the link records a dependency on libcuda.so.1 on Linux
      # and nvcuda.dll on Windows. Both ship with the NVIDIA driver, not with
      # the toolkit, and these runners have no driver -- so the loader fails
      # before main() ever reads argv. Linux takes the next-strongest claim
      # instead: resolve every dependency without running the binary, and
      # require all of them except that one driver library. Windows has no
      # equivalent tool on this runner, so its CUDA binary is proven to exist
      # and no more; the first thing that runs it is release QA on real hardware.
      - name: Assert the binary exists and starts
        env:
          BINARY: ${{ matrix.binary }}
          IS_CUDA: ${{ matrix.cuda }}
        run: |
          set -euo pipefail
          if [ ! -f "$BINARY" ]; then
            echo "::error::$BINARY was not produced by the compile step."
            exit 1
          fi
          ls -la "$BINARY"

          if [ "$IS_CUDA" != "true" ]; then
            # Not `if ! out=$("$BINARY" --version)`: inside that `if`, $? is the
            # status of the negation, not of the binary. Capture it on the ||
            # branch, which `set -e` also leaves alone.
            status=0
            out=$("$BINARY" --version 2>&1) || status=$?
            echo "$out"
            if [ "$status" -ne 0 ]; then
              echo "::error::$BINARY does not start: --version exited $status. See the output above."
              exit 1
            fi
            # Exit 0 alone is not enough. An empty file with the executable bit
            # set is run by the shell as an empty script and exits 0, so require
            # the build header llama.cpp actually prints ("version: <build>
            # (<commit>)", on stderr) before calling this a working binary.
            if ! echo "$out" | grep -q "^version: "; then
              echo "::error::$BINARY exited 0 but printed no llama.cpp build header, so it is not a working llama-server."
              exit 1
            fi
            echo "The compiled inference binary starts."
            exit 0
          fi

          if [ "${RUNNER_OS}" = "Linux" ]; then
            status=0
            deps=$(ldd "$BINARY" 2>&1) || status=$?
            echo "$deps"
            if [ "$status" -ne 0 ]; then
              echo "::error::ldd could not read $BINARY (exit $status): it is not a usable dynamic executable for this architecture."
              exit 1
            fi
            # grep exits 1 when it matches nothing, which is the passing case.
            missing=$(echo "$deps" | grep "not found" | grep -v "libcuda\.so\.1") || missing=""
            if [ -n "$missing" ]; then
              echo "::error::$BINARY has unresolved dependencies beyond the NVIDIA driver library:"
              echo "$missing"
              exit 1
            fi
            echo "Every dependency resolves except libcuda.so.1, which comes from the NVIDIA driver."
            exit 0
          fi

          echo "CUDA build on ${RUNNER_OS}: it links nvcuda.dll from the NVIDIA driver, so a driverless runner cannot load it. Existence is all this leg proves."
