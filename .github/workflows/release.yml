name: Release

# Auto-release on a vX.Y.Z tag: each matrix leg builds its PyInstaller backend
# (native runner — PyInstaller can't cross-compile), compiles the inference binary
# it needs (Windows: llama-server from the llama.cpp submodule; macOS: none, MLX is
# pip), then electron-builder packages, signs (macOS), and publishes to the SAME
# GitHub Release (draft). Windows ships TWO auto-update channels on the one release:
# `latest` (the CPU build, universal — runs on every machine) and `cuda` (the GPU
# build). Each installed app follows the channel baked into its app-update.yml at
# build time, so a user picks cpu-vs-cuda once at download and then auto-updates
# within that channel. CI starts the bundled CPU inference binary but can run no
# inference (no GPU runner, and the CUDA binaries need an NVIDIA driver to load at
# all), so a tag publishes a DRAFT that is QA'd on real hardware before promotion
# (release.yml only builds + publishes the draft — see docs/dev/release-qa-checklist.md).
on:
  push:
    tags:
      - "v*"

# One release at a time per tag; never cancel a half-published matrix.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create/upload GitHub Release assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon (MLX inference, no llama-server)
            variant: mac-arm
            reqs: mac-silicon-prod.txt
            spec: backend-mac-silicon.spec
            release_script: release:mac
            eb_extra_args: ""
          - os: windows-2022 # x64 CPU — the `latest` (universal) auto-update channel
            variant: win-cpu
            reqs: win-cpu-prod.txt
            spec: backend-cpu.spec
            release_script: release:win
            llama_build: cpu
            eb_extra_args: ""
          - os: windows-2022 # x64 CUDA — the `cuda` auto-update channel
            variant: win-cuda
            reqs: win-cuda-prod.txt
            spec: backend.spec
            release_script: release:win
            llama_build: cuda
            # Distinct channel (-> cuda.yml) + distinct artifact name so the two
            # Windows installers never clobber each other's update feed.
            eb_extra_args: "-c.publish.channel=cuda -c.nsis.artifactName='${productName}-Setup-${version}-cuda.${ext}'"
          - os: ubuntu-22.04 # x64 CPU — the `latest` (universal) Linux channel
            variant: linux-cpu
            reqs: linux-cpu-prod.txt
            spec: backend-cpu.spec
            release_script: release:linux
            llama_build: cpu
            eb_extra_args: ""
          - os: ubuntu-22.04 # x64 CUDA — the `cuda` Linux channel (cuda-linux.yml)
            variant: linux-cuda
            reqs: linux-cuda-prod.txt
            spec: backend.spec
            release_script: release:linux
            llama_build: cuda
            eb_extra_args: "-c.publish.channel=cuda -c.linux.artifactName='${productName}-${version}-cuda.${ext}'"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # consistent shell on every OS (git-bash on Windows)

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # llama.cpp source for the Windows inference build

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12" # hard pin: pgserver ships cp312 wheels only
          cache: pip
          cache-dependency-path: backend/requirements/**/*.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── CUDA toolkit (cuda legs only) ────────────────────────────────────────
      # Needed to COMPILE the CUDA llama-server. Compilation does NOT need a GPU
      # (only execution does), so this runs fine on the GPU-less runner. The pinned
      # runners keep the host toolchain in CUDA 12.6.3's supported range — notably
      # Windows = VS 2022 / MSVC 14.4x (windows-latest drifted to VS 2026 / MSVC
      # 14.51, which nvcc cannot parse → CMake CUDA compiler-id fails). The install
      # differs per OS:
      #   Windows → network install (works as-is).
      #   Linux   → toolkit-only via apt sub-packages — no driver (the `cuda` meta-
      #             package's nvidia-driver-560-open/dkms can't configure on a GPU-
      #             less runner) and, unlike the local `--toolkit` runfile, no multi-
      #             GB transient extraction that filled the small ubuntu / mid-build.
      # 12.8 is deliberate, not just "recent": it is the first toolkit whose nvcc
      # can emit native code for Blackwell (sm_120, the RTX 50 series). Built with
      # anything older, those cards still work -- the driver JIT-compiles them from
      # PTX -- but they pay a compile on first load and run Ada-generation code
      # paths. The build scripts add 120-real only when the toolkit is >= 12.8, so
      # a contributor on an older 12.x can still build.
      - name: Install CUDA Toolkit (Windows — network)
        if: matrix.llama_build == 'cuda' && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
      - name: Install CUDA Toolkit (Linux — toolkit-only, no driver)
        if: matrix.llama_build == 'cuda' && runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
          # cuda-* compiler + headers, plus the libcublas that ggml-cuda links.
          sub-packages: '["nvcc", "cudart-dev", "cccl", "nvtx", "nvrtc-dev"]'
          non-cuda-sub-packages: '["libcublas-dev"]'

      # Headroom insurance for the CUDA compile: drop preinstalled
      # bloat we never use (~20 GB) so a thin-disk runner can't run out mid-build.
      - name: Free disk space (Linux CUDA build)
        if: matrix.llama_build == 'cuda' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      # ── Backend: Python deps + PyInstaller ───────────────────────────────────
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r backend/requirements/entrypoints/prod/${{ matrix.reqs }}
          pip install pyinstaller

      # ── Windows/Linux: compile llama-server from the submodule. The variant-aware
      #    spec then bundles artifacts/llama-cpp/<cpu|cuda>/bin into the frozen
      #    backend. mac is MLX, so it has no llama-server step.
      - name: Build llama-server (Windows inference binary)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/dev/backend/build-llamacpp-${{ matrix.llama_build }}-win.ps1

      - name: Build llama-server (Linux inference binary)
        if: runner.os == 'Linux'
        run: bash scripts/dev/backend/build-llamacpp-${{ matrix.llama_build }}-linux.sh

      - name: Build backend bundle
        run: pyinstaller backend/${{ matrix.spec }} --distpath backend/dist

      # backend.spec already refuses to build without llama-server, but it can
      # only check what it was handed: PyInstaller could still drop the file on
      # its way into the bundle. Verify the frozen tree on disk before anything
      # is packaged, so a release can never publish an app that loads a model
      # and then fails at the first message. mac is MLX and has no such binary,
      # hence the llama_build guard.
      #
      # This checks the copy in backend/dist, which is a different claim from
      # the one llamacpp-build.yml makes about the compiled artifact: the freeze
      # copies the file into a new tree and can pick up the wrong flavour, drop
      # a sibling runtime library, or lose the executable bit.
      - name: Verify the bundled inference binary
        if: matrix.llama_build != ''
        env:
          LLAMA_FLAVOUR: ${{ matrix.llama_build }}
        run: |
          set -euo pipefail
          # Not `[ ... ] && exe=...`: under `set -e` a false test would exit 1.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            exe="llama-server.exe"
          else
            exe="llama-server"
          fi
          found=$(find backend/dist -type f -name "$exe" -print -quit)
          if [ -z "$found" ]; then
            echo "::error::$exe is missing from the frozen backend. The $LLAMA_FLAVOUR build produced no inference engine; refusing to package."
            find backend/dist -maxdepth 4 -type d -name "llama-cpp" -exec ls -R {} + || true
            exit 1
          fi
          echo "Found inference binary: $found"
          # The Windows CUDA bundle carries its own CUDA runtime so a user needs
          # only an NVIDIA driver, never the toolkit. If those DLLs go missing
          # the installer still builds and then fails to start the engine on
          # every machine, so treat their absence as a release blocker too.
          if [ "${RUNNER_OS}" = "Windows" ] && [ "$LLAMA_FLAVOUR" = "cuda" ]; then
            bindir=$(dirname "$found")
            for dll in cudart64_12.dll cublas64_12.dll cublasLt64_12.dll; do
              if [ ! -f "$bindir/$dll" ]; then
                echo "::error::$dll is missing next to llama-server.exe; the CUDA build would require the user to install the CUDA toolkit."
                ls -la "$bindir"
                exit 1
              fi
            done
            echo "CUDA runtime DLLs present next to the server."
          fi
          # Presence is not startability: `find` matches a filename, and would
          # be just as happy with a truncated file, a wrong-architecture build,
          # or one whose libraries do not resolve. So start the bundled copy.
          # `--version` prints the build header from llama.cpp's common/arg.cpp
          # and calls exit(0) inside the argument parser, before
          # llama_backend_init() -- it loads no model and needs no accelerator.
          #
          # Only the CPU flavours can be started here. ggml compiles its VMM
          # path in by default (GGML_CUDA_NO_VMM is OFF), so a CUDA build links
          # the CUDA driver library -- libcuda.so.1 on Linux, nvcuda.dll on
          # Windows -- which ships with the NVIDIA driver rather than the
          # toolkit. These runners have no driver, so the loader would fail
          # before main() reads argv, and no choice of argument avoids that.
          # The CUDA binaries are first run by release QA on real hardware
          # (docs/dev/release-qa-checklist.md).
          if [ "$LLAMA_FLAVOUR" = "cpu" ]; then
            # Same trap as the exe name above, from the other direction: not
            # `if ! out=$("$found" --version)`, because inside that `if` $? is
            # the status of the negation rather than of the binary. Capture it
            # on the || branch, which `set -e` also leaves alone.
            status=0
            out=$("$found" --version 2>&1) || status=$?
            echo "$out"
            if [ "$status" -ne 0 ]; then
              echo "::error::$found is bundled but does not start: --version exited $status. Packaging it would ship an app that loads a model and then fails at the first message."
              exit 1
            fi
            # Exit 0 alone is not enough. An empty file with the executable bit
            # set is run by the shell as an empty script and exits 0, so require
            # the build header llama.cpp actually prints ("version: <build>
            # (<commit>)", on stderr) before calling this a working binary.
            if ! echo "$out" | grep -q "^version: "; then
              echo "::error::$found exited 0 but printed no llama.cpp build header, so the bundled file is not a working llama-server."
              exit 1
            fi
            echo "The bundled inference binary starts."
          else
            echo "CUDA build: not started here, because it links the NVIDIA driver library and this runner has no driver. Release QA on real hardware is what runs it."
          fi

      # ── Frontend: webpack build → electron-builder package + sign + publish ──
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync version from tag
        working-directory: frontend
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Build, sign and publish (electron-builder)
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (electron-builder does it natively).
          # Empty on the Windows legs so they stay unsigned for now (SignPath later).
          CSC_LINK: ${{ matrix.variant == 'mac-arm' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.variant == 'mac-arm' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.variant == 'mac-arm' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.variant == 'mac-arm' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.variant == 'mac-arm' && secrets.APPLE_TEAM_ID || '' }}
        # `-- ${{ matrix.eb_extra_args }}` forwards per-leg overrides to
        # electron-builder (empty for mac/win-cpu; channel + artifactName for win-cuda).
        run: npm run ${{ matrix.release_script }} -- ${{ matrix.eb_extra_args }}
