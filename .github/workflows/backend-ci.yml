name: Backend CI

# `push` is restricted to main. Without that restriction every commit on a PR
# branch triggered this workflow TWICE -- once as `push`, once as
# `pull_request` -- and the two runs were identical.
#
# `merge_group` is what makes the merge queue work now that push no longer
# matches its `gh-readonly-queue/**` branches. Removing one without adding the
# other would leave the queue waiting on a check that can never report.
#
# No `paths` filter on purpose: this is a REQUIRED check, and a required check
# that does not run because a path filter excluded it never reports at all,
# which blocks the pull request forever. Always running costs a few minutes
# that overlap the longer app-build-smoke anyway.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A superseded run teaches us nothing: cancel it when a new commit arrives.
# Never on main or in the queue, where every run must complete.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-ci:
    name: backend-ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # All three legs are merge gates: a platform-specific failure blocks the
    # merge like any other.
    strategy:
      # Never cancel the other legs when one fails: a failure on one platform
      # should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x64 CPU
            reqs: linux-cpu.txt
            lock: linux-cpu-prod.txt
            prod_entrypoints: linux-cpu-prod.txt linux-cuda-prod.txt
            venv_bin: bin
            fail_fast: '-x'
          - os: windows-latest # x64 CPU
            reqs: win-cpu.txt
            lock: win-cpu-prod.txt
            prod_entrypoints: win-cpu-prod.txt win-cuda-prod.txt
            venv_bin: Scripts
            fail_fast: '-x'
          - os: macos-15 # Apple Silicon
            reqs: mac-silicon.txt
            lock: mac-silicon-prod.txt
            prod_entrypoints: mac-silicon-prod.txt
            venv_bin: bin
            fail_fast: '-x'
    env:
      PYTHONUNBUFFERED: 1
    defaults:
      run:
        shell: bash # git-bash on Windows: consistent forward-slash paths
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # setup-python already scopes its pip cache key by runner OS and
          # architecture, so the three legs cannot collide on one key.
          cache: 'pip'
          cache-dependency-path: backend/requirements/**

      - name: Install pip, wheel, setuptools
        run: python -m pip install --upgrade pip wheel setuptools

      # Constrained to the versions of the prod lock of this OS, so the tests run
      # on what a release ships. The dev tools (pytest, ruff, ...) are not in the
      # lock and resolve freely, within the locked versions of what they share
      # with it. The lock's hashes stay out: in a constraints file they would
      # turn on hash-checking for the whole install.
      - name: Create venv & install requirements
        run: |
          python -m venv backend/venv
          py=backend/venv/${{ matrix.venv_bin }}/python
          $py scripts/ci/check_backend_lock.py constraints backend/requirements/lock/${{ matrix.lock }} > backend/venv/lock-constraints.txt
          $py -m pip install -r backend/requirements/entrypoints/dev/${{ matrix.reqs }} -c backend/venv/lock-constraints.txt

      # The prod locks of this OS, checked with this machine's own pip and
      # markers: each entrypoint resolves to exactly its lock, and installing
      # the lock selects its locked files. The CUDA locks are installed by a
      # release tag only, so this is their check on every pull request.
      - name: Check the prod locks of this OS
        run: |
          for entrypoint in ${{ matrix.prod_entrypoints }}; do
            backend/venv/${{ matrix.venv_bin }}/python scripts/ci/check_backend_lock.py resolution backend/requirements/entrypoints/prod/$entrypoint
          done

      - name: Syntax check
        run: backend/venv/${{ matrix.venv_bin }}/python -m compileall backend/src -q

      # `backend scripts` is every Python file in the repository, and it is
      # also exactly what the pre-commit hooks touch. Anything narrower lets
      # a hook autofix a file that no gate ever looks at.
      - name: Lint (ruff)
        run: backend/venv/${{ matrix.venv_bin }}/python -m ruff check backend scripts

      # `ruff format` is the project's only formatter. Checking it here is what
      # stops the tree drifting away from it again. Width and exclusions come
      # from the ruff.toml nearest each file, so there are no flags to keep in
      # sync with the hooks.
      - name: Format check (ruff format)
        run: backend/venv/${{ matrix.venv_bin }}/python -m ruff format --check backend scripts

      - name: Import check
        run: |
          cd backend
          venv/${{ matrix.venv_bin }}/python -c "from src.main import app; print('OK')"

      # `-m "not mlx_only"` is kept on EVERY leg on purpose, macos-15 included.
      # macos-15 is the one runner where the mlx_only tests could actually
      # execute, and they pull a ~280 MB fixture model (mlx_test_model_path in
      # tests/conftest.py). This workflow is here to get signal on the shared
      # suite; adding a model download to CI is a separate decision. Deliberate
      # exclusion, not an oversight.
      - name: Tests
        run: |
          cd backend
          venv/${{ matrix.venv_bin }}/python -m pytest tests/ ${{ matrix.fail_fast }} -q --ignore=tests/e2e -m "not mlx_only"
