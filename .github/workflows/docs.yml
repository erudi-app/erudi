# Publishes the documentation site to GitHub Pages (https://erudi-app.github.io/erudi/).
# Built with Zensical (docs/requirements.txt) reading mkdocs.yml directly —
# Material for MkDocs reaches end of life on 2026-11-05 and Zensical is its
# maintained successor.
#
# Pull requests only build — with --strict, so a broken link or a mkdocstrings
# path that no longer exists fails the check instead of shipping a 404. The
# deploy job runs on main only and uses the Pages deployment API rather than a
# gh-pages branch, so no commit is ever pushed by CI.
#
# mkdocstrings renders the API reference by static analysis (griffe), so the
# backend's dependencies are not installed: only the documentation tooling is.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "backend/src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Build (strict)
        run: zensical build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
