name: App Build Smoke

# Merge gate: build the FULL shippable app on each platform — PyInstaller backend
# + webpack renderer + electron-builder package (UNSIGNED, no publish) — then boot
# the BUNDLED backend (Contents/Resources/backend) and assert it reaches "ready".
# This validates that what we ship BUILDS and BOOTS (backend freeze + electron
# packaging + backend bundling) on the real shippable artifact, without inference
# (inference/scenarios stay in the manual draft QA). The Windows leg also installs
# a pinned published release (v1.1.2) and updates it with the new installer, the path
# every Windows user takes to get the new version. It supersedes the backend-only
# win smoke. Heavy, so it runs only when a PR is ready (not draft) or in the merge
# queue — never on every draft commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: app-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-smoke:
    # Skip on draft PRs: the heavy build runs once the PR is marked ready (and in
    # the merge queue once enabled), not on every work-in-progress commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Explicit name: the required checks on main are these four matrix values,
    # so a matrix key added later (eb_sign_args) must not reach the check name.
    name: app-smoke (${{ matrix.os }}, ${{ matrix.reqs }}, ${{ matrix.spec }}, ${{ matrix.dist_script }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon
            reqs: mac-silicon-prod.txt
            spec: backend-mac-silicon.spec
            dist_script: dist:mac
            # No certificate on this leg: electron-builder signs every file ad
            # hoc (hardened runtime and entitlements included) instead of
            # leaving a signature on the main executable only (#690).
            eb_sign_args: "-c.mac.identity=-"
          - os: windows-latest # x64 CPU
            reqs: win-cpu-prod.txt
            spec: backend-cpu.spec
            dist_script: dist:win
          - os: ubuntu-latest # x64 CPU
            reqs: linux-cpu-prod.txt
            spec: backend-cpu.spec
            dist_script: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUNBUFFERED: 1
      ERUDI_FORCE_CPU: 1
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned smoke build (no notarization)
    defaults:
      run:
        shell: bash # git-bash on Windows: consistent forward-slash paths
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12" # hard pin: pgserver ships cp312 wheels only
          cache: pip
          cache-dependency-path: backend/requirements/**/*.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installs the lock (backend + PyInstaller) into a fresh venv and fails on
      # any difference from it; the venv is on PATH from the next step on.
      - name: Install backend dependencies
        run: bash scripts/ci/install_backend_requirements.sh backend/requirements/entrypoints/prod/${{ matrix.reqs }}

      # ── Windows/Linux: the KB embedding GGUF the installers bundle (#594),
      #    so the smoke freezes and boots what a release ships. Restored from
      #    the cache the release workflow shares; on a miss the conversion
      #    fetches the llama.cpp submodule (converter + gguf-py — the smoke
      #    checkout skips submodules) and runs in its OWN venv from the
      #    per-OS build lock, hash-checked and never on PATH, exactly as in
      #    release.yml.
      - name: Restore the KB embedding GGUF (cache)
        if: runner.os != 'macOS'
        id: e5-gguf-cache
        uses: actions/cache@v4
        with:
          path: backend/artifacts/kb-embedder
          key: e5-gguf-${{ runner.os }}-${{ hashFiles('scripts/dev/backend/build_e5_gguf.py', 'scripts/dev/backend/e5-conversion.patch') }}

      - name: Produce the KB embedding GGUF
        if: runner.os != 'macOS' && steps.e5-gguf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git submodule update --init backend/forks/llama-cpp
          if [ "${RUNNER_OS}" = "Windows" ]; then
            lock=win-e5-gguf.txt; venv_py=e5-gguf-venv/Scripts/python
          else
            lock=linux-e5-gguf.txt; venv_py=e5-gguf-venv/bin/python
          fi
          python -m venv e5-gguf-venv
          "$venv_py" -m pip install --quiet --disable-pip-version-check -r "backend/requirements/lock/$lock" --require-hashes --no-deps
          "$venv_py" scripts/ci/check_backend_lock.py installed "backend/requirements/lock/$lock"
          "$venv_py" scripts/dev/backend/build_e5_gguf.py

      - name: Build frozen backend (PyInstaller)
        env:
          # This gate proves the backend boots to `ready`; it does not compile
          # llama.cpp and never runs inference, so it is the one build allowed
          # to ship without an inference binary. Releases must not set this -
          # backend.spec fails hard there, on purpose.
          ERUDI_ALLOW_MISSING_INFERENCE_BINARY: "1"
        run: pyinstaller backend/${{ matrix.spec }} --distpath backend/dist

      # python-docx reads its default parts through <docx/parts>/../templates/;
      # a bundle without docx/parts/ on disk cannot open a .docx saved without
      # a styles part (TextEdit): macOS and Linux fail with ENOENT, only
      # Windows normalises the `..` lexically, and it surfaces when a user
      # drops such a file (#705). Checked on every leg: it only walks the
      # frozen tree.
      - name: Check the frozen backend ships python-docx's default parts
        run: python scripts/ci/check_docx_default_parts.py backend/dist

      - name: Check the frozen backend's macOS floor
        if: runner.os == 'macOS'
        run: bash scripts/ci/check_macos_floor.sh backend/dist "$MACOS_FLOOR"

      - name: Build packaged app (unsigned, no publish)
        working-directory: frontend
        env:
          # electron-builder skips signing on a pull request (GITHUB_BASE_REF)
          # unless this is set. This leg holds no secret and signs ad hoc.
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          npm ci
          npm run ${{ matrix.dist_script }} -- --publish never ${{ matrix.eb_sign_args }}

      # The app must verify as a whole and carry the hardened runtime: an ad hoc
      # signature on the main executable only fails the check and macOS 26
      # refuses to launch it (#690).
      - name: Check the macOS app signature
        if: runner.os == 'macOS'
        run: bash scripts/ci/check_mac_app_signature.sh frontend/dist/mac-arm64/Erudi.app

      - name: Locate the bundled backend executable
        id: locate
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXE=$(find frontend/dist -path "*Erudi.app/Contents/Resources/backend/backend" -type f | head -1)
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # The backend is packed inside the AppImage; extract it (no FUSE needed).
            APPIMAGE=$(find frontend/dist -name "*.AppImage" | head -1)
            chmod +x "$APPIMAGE"
            "$APPIMAGE" --appimage-extract >/dev/null
            EXE=$(find squashfs-root -path "*resources/backend/backend" -type f | head -1)
          else
            EXE=$(find frontend/dist -path "*resources/backend/backend.exe" -type f | head -1)
          fi
          echo "Bundled backend: '$EXE'"
          test -n "$EXE"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the bundled backend boot (assert "ready")
        env:
          SMOKE_TIMEOUT: 300
        run: python scripts/ci/smoke_boot.py "${{ steps.locate.outputs.exe }}" --port 27182

      # Windows only: install v1.1.2, then run the installer built above over
      # it, by hand (/S) and the way electron-updater does (--updated /S), and
      # check each update lands with the old uninstaller succeeding at its first
      # attempt. Installing over an existing Erudi runs the old version's
      # uninstaller, which fails on a directory of 248 characters or a file of
      # 260 under %TEMP%; frontend/assets/installers/installer.nsh removes the
      # deepest files before it runs. The base release is pinned: v1.1.2 carries
      # the torch license tree (every release up to 1.2.0 does) that reaches the
      # limit on this runner, with no margin. The script fails when the run cannot reach that limit, when the
      # new build comes too close to it, and on any download error (the release
      # is read with this workflow's token).
      - name: Update over v1.1.2
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/check_win_update_over_release.ps1 -DistDir frontend/dist -BaseTag v1.1.2
