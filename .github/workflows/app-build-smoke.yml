name: App Build Smoke

# Merge gate: build the FULL shippable app on each platform — PyInstaller backend
# + webpack renderer + electron-builder package (UNSIGNED, no publish) — then boot
# the BUNDLED backend (Contents/Resources/backend) and assert it reaches "ready".
# This validates that what we ship BUILDS and BOOTS (backend freeze + electron
# packaging + backend bundling) on the real shippable artifact, without inference
# (inference/scenarios stay in the manual draft QA). The Windows leg also installs
# the latest published release and updates it with the new installer, the path
# every Windows user takes to get the new version. It supersedes the backend-only
# win smoke. Heavy, so it runs only when a PR is ready (not draft) or in the merge
# queue — never on every draft commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: app-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-smoke:
    # Skip on draft PRs: the heavy build runs once the PR is marked ready (and in
    # the merge queue once enabled), not on every work-in-progress commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon
            reqs: mac-silicon-prod.txt
            spec: backend-mac-silicon.spec
            dist_script: dist:mac
          - os: windows-latest # x64 CPU
            reqs: win-cpu-prod.txt
            spec: backend-cpu.spec
            dist_script: dist:win
          - os: ubuntu-latest # x64 CPU
            reqs: linux-cpu-prod.txt
            spec: backend-cpu.spec
            dist_script: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUNBUFFERED: 1
      ERUDI_FORCE_CPU: 1
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned smoke build (no notarization)
    defaults:
      run:
        shell: bash # git-bash on Windows: consistent forward-slash paths
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12" # hard pin: pgserver ships cp312 wheels only
          cache: pip
          cache-dependency-path: backend/requirements/**/*.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frozen backend (PyInstaller)
        env:
          # This gate proves the backend boots to `ready`; it does not compile
          # llama.cpp and never runs inference, so it is the one build allowed
          # to ship without an inference binary. Releases must not set this -
          # backend.spec fails hard there, on purpose.
          ERUDI_ALLOW_MISSING_INFERENCE_BINARY: "1"
        run: |
          bash scripts/ci/install_backend_requirements.sh backend/requirements/entrypoints/prod/${{ matrix.reqs }}
          pip install pyinstaller
          pyinstaller backend/${{ matrix.spec }} --distpath backend/dist

      - name: Check the frozen backend's macOS floor
        if: runner.os == 'macOS'
        run: bash scripts/ci/check_macos_floor.sh backend/dist "$MACOS_FLOOR"

      - name: Build packaged app (unsigned, no publish)
        working-directory: frontend
        run: |
          npm ci
          npm run ${{ matrix.dist_script }} -- --publish never

      - name: Locate the bundled backend executable
        id: locate
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXE=$(find frontend/dist -path "*Erudi.app/Contents/Resources/backend/backend" -type f | head -1)
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # The backend is packed inside the AppImage; extract it (no FUSE needed).
            APPIMAGE=$(find frontend/dist -name "*.AppImage" | head -1)
            chmod +x "$APPIMAGE"
            "$APPIMAGE" --appimage-extract >/dev/null
            EXE=$(find squashfs-root -path "*resources/backend/backend" -type f | head -1)
          else
            EXE=$(find frontend/dist -path "*resources/backend/backend.exe" -type f | head -1)
          fi
          echo "Bundled backend: '$EXE'"
          test -n "$EXE"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the bundled backend boot (assert "ready")
        env:
          SMOKE_TIMEOUT: 300
        run: python scripts/ci/smoke_boot.py "${{ steps.locate.outputs.exe }}" --port 27182

      # Windows only: install the latest published release, then run the
      # installer built above over it the way electron-updater does, and check
      # the update lands. Installing over an existing Erudi runs the old
      # version's uninstaller, which fails on a path of 260 characters or more
      # under %TEMP%; frontend/assets/installers/installer.nsh recovers from it.
      # The script fails when the run cannot reach that limit, and on any
      # download error (the release is read with this workflow's token).
      - name: Update over the latest published release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/check_win_update_over_release.ps1 -DistDir frontend/dist
