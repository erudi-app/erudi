[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
addopts = --strict-markers
# A hung test used to consume the whole job limit and report nothing, which on a
# blocking leg means no signal at all -- the opposite of what #335 is for. The
# ceiling is deliberately generous: it exists to catch a deadlock, not to police
# slow tests. The session-scoped pgserver fixture runs inside the first test's
# setup and is the longest legitimate stretch here.
timeout = 600
markers =
    unit: fast, fully mocked, no external dependency (default for CI)
    integration: cross-component, may hit DB or filesystem
    mlx_only: requires Apple Silicon + mlx-lm + downloaded model (skipped on Linux CI)
    e2e: full-stack via FastAPI TestClient + real model (skipped on Linux CI)
    network: hits the live Hugging Face API (opt-in via ERUDI_TEST_NETWORK=1; skipped in CI)
    real_cache_limit: runs the real `_bound_buffer_cache` (every other test gets a no-op, so no test caps the pytest process's MLX cache)
